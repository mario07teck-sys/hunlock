name: Pointage NFC APK
on:
  push:
    paths: ["pointage-nfc/**", ".github/workflows/pointage-nfc.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pointage-nfc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pointage-nfc-apk
          path: pointage-nfc/app/build/outputs/apk/debug/app-debug.apk
