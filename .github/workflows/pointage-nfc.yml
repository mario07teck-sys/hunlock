name: NFC Timer
on:
  push:
    paths: ["pointage-nfc/**", ".github/workflows/pointage-nfc.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pointage-nfc
    env:
      KEYSTORE_BASE64: ${{ secrets.NFC_TIMER_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.NFC_TIMER_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nfc-timer-apk
          path: pointage-nfc/app/build/outputs/apk/debug/app-debug.apk
      # Play Store bundle, only once the upload key secrets exist (see pointage-nfc/README.md).
      - if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease
      - if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: nfc-timer-play-store-aab
          path: pointage-nfc/app/build/outputs/bundle/release/app-release.aab
